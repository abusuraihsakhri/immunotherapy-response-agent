[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immunotherapy-response-engine"
version = "2.0.1"
description = "Deterministic research demonstrations and audit utilities for oncology-oriented workflows"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.25,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.110,<1"]

[project.scripts]
immunotherapy-response-engine = "immunotherapy_response_agent.cli:main"
immunotherapy-response-agent = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/immunotherapy-response-agent"
Repository = "https://github.com/abusuraihsakhri/immunotherapy-response-agent"

[tool.setuptools]
packages = ["agents", "immunotherapy_response_agent"]
py-modules = ["cli", "immuno_mind", "simulator", "enrichment", "csv_utils", "immuno_mind_app", "immunotherapy_response_agent_app"]
