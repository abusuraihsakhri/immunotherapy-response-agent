[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "immunotherapy-response-engine"
version = "2.0.0"
description = "ImmunoMind: Tumor Mutation Burden, MSI-H & Immune Checkpoint Predictor Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
immunotherapy-response-engine = "immunotherapy_response_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/immunotherapy-response-engine"
Repository = "https://github.com/abusuraihsakhri/immunotherapy-response-engine.git"
