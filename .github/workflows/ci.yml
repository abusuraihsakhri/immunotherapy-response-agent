name: Tests and static checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install distribution and test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Check runtime dependency consistency
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents immunotherapy_response_agent cli.py immuno_mind.py enrichment.py csv_utils.py
      - name: Run regression suite
        run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser script syntax
        run: node --check web/app.js
      - name: Test deterministic browser rules
        run: node --test web/app.test.cjs
