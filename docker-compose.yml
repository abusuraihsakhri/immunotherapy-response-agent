version: '3.8'

services:
  immunotherapy-response-engine:
    build: .
    container_name: immunotherapy-response-engine
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set a unique AUDIT_SECRET_KEY in your environment}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
